name: Mutation testing
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mutation testing
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/mutation-vitest-summary.md" npm run mutation
      - name: Mutation summary
        if: always()
        run: |
          if test -f reports/mutation/mutation.json; then
            node scripts/mutation-summary.mjs reports/mutation/mutation.json "$GITHUB_STEP_SUMMARY"
          fi
      - name: Full mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: warn
