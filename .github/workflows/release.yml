name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm uses OIDC for Trusted Publishing and the explicit provenance flag below.
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: node scripts/pack-smoke.mjs
      - run: npm publish --access public --provenance
