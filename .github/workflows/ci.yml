name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node --test scripts/source-watch.test.mjs
      - run: node --test scripts/live-aeat.test.mjs
      - run: node --test scripts/mutation-summary.test.mjs
      - run: node scripts/pack-smoke.mjs
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm run test:coverage
      - name: Mutation testing
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/mutation-vitest-summary.md" npm run mutation
      - name: Mutation summary
        if: always()
        run: |
          if test -f reports/mutation/mutation.json; then
            node scripts/mutation-summary.mjs reports/mutation/mutation.json "$GITHUB_STEP_SUMMARY"
          fi
      - name: Full mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: warn
