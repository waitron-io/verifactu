name: AEAT preproduction integration

on:
  schedule:
    - cron: "23 10 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Test mode
        type: choice
        options:
          - consult
          - submit
          - mixed-regime
          - mixed-regime-consult
        default: consult
        required: true
      excluded_regime:
        description: Excluded regime used by mixed-regime mode
        type: choice
        options:
          - "03"
          - "05"
          - "06"
          - "08"
          - "09"
        default: "03"
        required: true
      existing_run_id:
        description: GitHub run ID embedded in the existing mixed-regime record
        type: string
        required: false
      existing_issue_date:
        description: Issue date of the existing mixed-regime record (DD-MM-YYYY)
        type: string
        required: false
      legacy_mixed_prefix:
        description: Existing regime-03 record uses the original CI-MIXED serial prefix
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  live:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AEAT_LIVE_TESTS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: aeat-preproduction
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Call AEAT preproduction
        env:
          AEAT_TEST_P12_BASE64: ${{ secrets.AEAT_TEST_P12_BASE64 }}
          AEAT_TEST_P12_PASSWORD: ${{ secrets.AEAT_TEST_P12_PASSWORD }}
          AEAT_TEST_NIF: ${{ secrets.AEAT_TEST_NIF }}
          AEAT_TEST_NAME: ${{ secrets.AEAT_TEST_NAME }}
          AEAT_TEST_CERT_KIND: ${{ vars.AEAT_TEST_CERT_KIND || 'personal' }}
          AEAT_TEST_SYSTEM_NIF: ${{ secrets.AEAT_TEST_SYSTEM_NIF }}
          AEAT_TEST_SYSTEM_NAME: ${{ secrets.AEAT_TEST_SYSTEM_NAME }}
          AEAT_TEST_RECIPIENT_NIF: ${{ secrets.AEAT_TEST_RECIPIENT_NIF }}
          AEAT_TEST_RECIPIENT_NAME: ${{ secrets.AEAT_TEST_RECIPIENT_NAME }}
          AEAT_TEST_EXCLUDED_REGIME: ${{ inputs.excluded_regime || '03' }}
          AEAT_TEST_EXISTING_RUN_ID: ${{ inputs.existing_run_id }}
          AEAT_TEST_EXISTING_ISSUE_DATE: ${{ inputs.existing_issue_date }}
          AEAT_TEST_LEGACY_MIXED_PREFIX: ${{ inputs.legacy_mixed_prefix }}
          TEST_MODE: ${{ github.event_name == 'schedule' && 'submit' || inputs.mode }}
        run: node scripts/live-aeat.mjs "$TEST_MODE"
