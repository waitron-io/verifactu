name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: website
      - run: npm run verify:examples
        working-directory: website
      - run: npm run verify:docs
        working-directory: website
      - run: npm run verify:types
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: npm run verify:links
        working-directory: website
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
